<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-01</title>
</head>
<body>
    <h1>Product Showcase</h1>
    <!-- Main section containing 6 product cards
• Each card should include: 
o Product image (use placeholder images)
o Product name
o Price
o "Add to Cart" button -->

<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2021/10/31/14/02/egg-6757508_1280.jpg" alt="Product Image">
    <h2>Eggs</h2>
    <p>Price: $50.99</p>
    <button>Add to Cart</button>
</div>


<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2025/05/16/16/14/investigation-9604083_1280.png" alt="Product Image">
    <h2>Power</h2>
    <p>Price: $50000.99</p>
    <button>Add to Cart</button>
</div>
<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2017/12/17/08/12/girl-3023831_1280.jpg" alt="Product Image">
    <h2>Stacey</h2>
    <p>Price: $6000.99</p>
    <button>Add to Cart</button>
</div>

<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2018/09/06/23/36/boxer-3659610_1280.jpg" alt="Product Image">
    <h2>Best seller</h2>
    <p>Price: $3500.99</p>
    <button>Add to Cart</button>
</div>

<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2018/03/18/21/09/people-3238357_1280.jpg" alt="Product Image">
    <h2>New</h2>
    <p>Price: $4000.99</p>
    <button>Add to Cart</button>
</div>

<div class="product-card">
    <img src="https://cdn.pixabay.com/photo/2016/02/11/19/14/couple-1194312_1280.jpg" alt="Product Image">
    <h2>Half Price</h2>
    <p>Price: $2500.99</p>
    <button>Add to Cart</button>
    
</div>

</body>
</html>
